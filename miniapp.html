<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Movie Zone</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c12;--surface:#0d1420;--card:#131b28;--card2:#1a2436;
  --border:rgba(255,255,255,0.07);--accent:#e8a020;--accent2:#c4501a;
  --text:#f0f4ff;--text2:#c8d0e0;--muted:#6a7a96;
  --radius:12px;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:99px}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* HEADER */
.header{flex-shrink:0;background:rgba(8,12,18,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);z-index:50;padding:10px 14px 0}
.logo{font-size:21px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.search-wrap{position:relative;flex:1}
.search-wrap input{width:100%;padding:9px 36px 9px 34px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:14px;pointer-events:none}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;display:none}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);
  background:var(--surface);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
  transition:color .2s,border-color .2s;flex-shrink:0}
.tab.active{color:var(--accent);border-color:var(--accent)}

/* SCROLL */
.content{flex:1;overflow-y:auto;overflow-x:hidden}
.tab-pane{display:none;padding:12px}
.tab-pane.active{display:block}

/* SECTION HEADER */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-title{font-size:15px;font-weight:700}
.section-more{font-size:12px;color:var(--accent);cursor:pointer}

/* RECENT STRIP */
.recent-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;margin-bottom:18px}
.recent-strip::-webkit-scrollbar{display:none}
.rc{flex-shrink:0;width:96px;cursor:pointer;border-radius:10px;overflow:hidden;
  background:var(--card);border:1px solid var(--border);transition:transform .15s}
.rc:active{transform:scale(.95)}
.rc-img{width:100%;height:136px;object-fit:cover;display:block}
.rc-fallback{width:100%;height:136px;background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-size:26px}
.rc-label{padding:5px 6px;font-size:10px;font-weight:600;color:var(--text2);
  line-height:1.3;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.card{background:var(--card);border-radius:10px;overflow:hidden;
  border:1px solid var(--border);cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card-img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.card-fallback{width:100%;aspect-ratio:2/3;background:var(--card2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;color:var(--muted);font-size:26px}
.card-fallback small{font-size:10px;text-align:center;padding:0 8px;line-height:1.3}
.card-info{padding:7px 8px}
.card-title{font-size:12px;font-weight:600;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  line-height:1.4;margin-bottom:3px}
.card-meta{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.card-badge{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;
  background:var(--accent2);color:#fff;margin-left:auto}

/* DETAIL SHEET */
.d-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .25s}
.d-overlay.open{opacity:1;pointer-events:auto}
.d-sheet{position:fixed;bottom:0;left:0;right:0;max-height:93dvh;
  background:var(--surface);border-radius:20px 20px 0 0;z-index:201;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden}
.d-sheet.open{transform:translateY(0)}
.d-handle{width:36px;height:4px;background:var(--muted);border-radius:99px;
  margin:10px auto 0;flex-shrink:0}
.d-header{position:relative;flex-shrink:0}
.d-backdrop{width:100%;height:155px;object-fit:cover;display:block}
.d-backdrop-fb{width:100%;height:110px;background:linear-gradient(135deg,var(--card2),var(--card));
  display:flex;align-items:center;justify-content:center;font-size:40px}
.d-close{position:absolute;top:8px;right:10px;width:30px;height:30px;
  border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.d-body{flex:1;overflow-y:auto;padding:14px}
.d-title{font-size:19px;font-weight:800;margin-bottom:3px;line-height:1.2}
.d-sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.d-overview{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;
  background:var(--card2);color:var(--text2);border:1px solid var(--border)}

/* FILE BUTTON */
.file-btn{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  margin-bottom:8px;cursor:pointer;text-align:left;transition:background .15s;color:var(--text)}
.file-btn:active{background:var(--card2)}
.file-icon{font-size:20px;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-size:12px;font-weight:600;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.file-size{font-size:11px;color:var(--muted);margin-top:2px}
.file-arr{color:var(--accent);font-size:18px;flex-shrink:0}

/* SEASON TABS */
.s-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.s-tabs::-webkit-scrollbar{display:none}
.s-tab{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
  background:var(--card);border:1px solid var(--border);cursor:pointer;
  white-space:nowrap;color:var(--muted);transition:all .15s;flex-shrink:0}
.s-tab.active{background:var(--accent);border-color:var(--accent);color:#000}
.ep-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;
  color:var(--text2);margin-bottom:6px}
.ep-chev{transition:transform .2s;color:var(--muted)}
.ep-files{display:none;padding-bottom:4px}
.ep-files.open{display:block}

/* LOAD MORE */
.load-more{width:100%;padding:10px;text-align:center;background:var(--card);
  border:1px solid var(--border);border-radius:10px;color:var(--accent);
  font-weight:600;font-size:13px;cursor:pointer;margin-top:10px;display:block}
.load-more:active{opacity:.7}

/* EMPTY / SPINNER */
.spinner{width:30px;height:30px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty-text{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}

/* TOAST */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:9px 18px;font-size:13px;font-weight:600;z-index:500;
  transition:transform .3s;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* REDIRECT OVERLAY */
#redir{position:fixed;inset:0;background:rgba(8,12,18,.96);z-index:999;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#redir.show{display:flex}
#redir .ri{font-size:52px}
#redir .rt{font-size:16px;font-weight:700;text-align:center}
#redir .rs{font-size:13px;color:var(--muted);text-align:center;max-width:240px;line-height:1.5}
#redir .rspin{width:26px;height:26px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-row">
      <span class="logo">🎬 MovieZone</span>
    </div>
    <div class="header-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="sInput" type="search" placeholder="Search movies, series…" autocomplete="off"/>
        <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="home" onclick="switchTab('home',this)">🏠 Home</div>
      <div class="tab" data-tab="movies" onclick="switchTab('movies',this)">🎬 Movies</div>
      <div class="tab" data-tab="series" onclick="switchTab('series',this)">📺 Series</div>
      <div class="tab" data-tab="search" id="searchTabBtn" style="display:none" onclick="switchTab('search',this)">🔍 Results</div>
    </div>
  </div>

  <div class="content">
    <!-- HOME -->
    <div class="tab-pane active" id="pane-home">
      <div class="section-hd">
        <span class="section-title">🆕 Recently Added</span>
        <span class="section-more" id="recentMoreBtn" onclick="switchTab('movies',document.querySelector('[data-tab=movies]'))">See all →</span>
      </div>
      <div class="recent-strip" id="recentStrip"><div class="spinner"></div></div>

      <div class="section-hd" style="margin-top:2px">
        <span class="section-title">🎬 Latest Movies</span>
        <span class="section-more" onclick="switchTab('movies',document.querySelector('[data-tab=movies]'))">More →</span>
      </div>
      <div id="hmGrid" class="grid"></div>
      <div id="hmMore"></div>

      <div class="section-hd" style="margin-top:16px">
        <span class="section-title">📺 Latest Series</span>
        <span class="section-more" onclick="switchTab('series',document.querySelector('[data-tab=series]'))">More →</span>
      </div>
      <div id="hsGrid" class="grid"></div>
      <div id="hsMore"></div>
    </div>

    <!-- MOVIES -->
    <div class="tab-pane" id="pane-movies">
      <div class="grid" id="mvGrid"></div>
      <div id="mvMore"></div>
    </div>

    <!-- SERIES -->
    <div class="tab-pane" id="pane-series">
      <div class="grid" id="srGrid"></div>
      <div id="srMore"></div>
    </div>

    <!-- SEARCH RESULTS -->
    <div class="tab-pane" id="pane-search">
      <div id="srchResults"></div>
    </div>
  </div>
</div>

<!-- DETAIL SHEET -->
<div class="d-overlay" id="dOverlay" onclick="closeDetail()"></div>
<div class="d-sheet" id="dSheet">
  <div class="d-handle"></div>
  <div class="d-header" id="dHdr"></div>
  <div class="d-body" id="dBody"></div>
</div>

<!-- REDIRECT OVERLAY -->
<div id="redir">
  <div class="ri">✈️</div>
  <div class="rt">Opening Bot DM…</div>
  <div class="rs">Your file is being prepared. Please check the bot chat.</div>
  <div class="rspin"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const API_BASE     = 'https://precious-mab-filetokensender-fdc78bed.koyeb.app';
const BOT_USERNAME = 'Navex_MoviesHub_Bot';

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ── STATE ───────────────────────────────────────────────────────────────────
const S = {
  movies: {page:0,loading:false,done:false,loaded:false},
  series: {page:0,loading:false,done:false,loaded:false},
  homeLoaded: false,
};

// ── API ─────────────────────────────────────────────────────────────────────
async function api(path) {
  const r = await fetch(API_BASE + path, {
    headers: {'X-Telegram-Init-Data': tg.initData||''},
  });
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// ── UTILS ───────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $id(id){return document.getElementById(id);}
function spin(el){el.innerHTML='<div class="spinner"></div>';}
function showEmpty(el,msg='Nothing here yet'){
  el.innerHTML=`<div class="empty"><div class="empty-icon">🎬</div><div class="empty-text">${esc(msg)}</div></div>`;
}
function showToast(msg,dur=2200){
  const el=$id('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}

// ── CARD HTML ────────────────────────────────────────────────────────────────
function cardHTML(item,small){
  const em = item.type==='series'?'📺':'🎬';
  const poster = item.poster
    ? `<img class="${small?'rc-img':'card-img'}" src="${esc(item.poster)}" loading="lazy"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  if (small) {
    return `<div class="rc" onclick="openDetail('${esc(item.id)}')">
      ${poster}<div class="rc-fallback" style="${item.poster?'display:none':''}">${em}</div>
      <div class="rc-label">${esc(item.name||item.group_title)}</div></div>`;
  }
  const year   = item.year ? `<span>${esc(item.year)}</span>` : '';
  const rating = item.rating ? `<span style="color:var(--accent)">⭐${item.rating}</span>` : '';
  const badge  = item.file_count>1 ? `<span class="card-badge">${item.file_count}</span>` : '';
  return `<div class="card" onclick="openDetail('${esc(item.id)}')">
    ${poster}<div class="card-fallback" style="${item.poster?'display:none':''}">
      <span>${em}</span><small>${esc(item.name||item.group_title)}</small></div>
    <div class="card-info">
      <div class="card-title">${esc(item.name||item.group_title)}</div>
      <div class="card-meta">${year}${rating}${badge}</div>
    </div></div>`;
}

// ── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  if(el) el.classList.add('active');
  const pane=$id('pane-'+name);
  if(pane) pane.classList.add('active');
  if(name==='home'   && !S.homeLoaded)   loadHome();
  if(name==='movies' && !S.movies.loaded) loadGrid('movies');
  if(name==='series' && !S.series.loaded) loadGrid('series');
}

// ── HOME ─────────────────────────────────────────────────────────────────────
function loadHome(){
  S.homeLoaded = true;
  loadRecent();
  loadHomeSection('movies','hmGrid','hmMore');
  loadHomeSection('series','hsGrid','hsMore');
}

async function loadRecent(){
  const el=$id('recentStrip');
  try {
    const d = await api('/miniapp/recent?page=0&limit=14');
    if(!d.ok||!d.results||!d.results.length){
      el.innerHTML='<div style="color:var(--muted);font-size:12px;padding:8px">No recent files yet</div>';
      return;
    }
    el.innerHTML=d.results.map(r=>cardHTML(r,true)).join('');
  } catch(e){
    el.innerHTML='<div style="color:var(--muted);font-size:12px;padding:8px">Could not load</div>';
  }
}

async function loadHomeSection(type,gridId,moreId){
  const grid=$id(gridId), more=$id(moreId);
  spin(grid);
  try {
    const d = await api(`/miniapp/browse?type=${type}&page=0&limit=6`);
    if(!d.ok||!d.results||!d.results.length){grid.innerHTML='';return;}
    grid.innerHTML=d.results.map(r=>cardHTML(r,false)).join('');
    more.innerHTML = d.has_more
      ? `<button class="load-more" onclick="switchTab('${type}',document.querySelector('[data-tab=${type}]'))">See all ${type} →</button>`
      : '';
  } catch(e){grid.innerHTML='';more.innerHTML='';}
}

// ── BROWSE GRIDS ─────────────────────────────────────────────────────────────
async function loadGrid(type){
  const s=S[type];
  if(s.loading||s.done) return;
  s.loading=true; s.loaded=true;
  const grid=$id(type==='movies'?'mvGrid':'srGrid');
  const more=$id(type==='movies'?'mvMore':'srMore');
  if(s.page===0) spin(grid);
  try {
    const d = await api(`/miniapp/browse?type=${type}&page=${s.page}&limit=24`);
    if(!d.ok) throw new Error(d.error||'error');
    if(!d.results||!d.results.length){
      if(s.page===0) showEmpty(grid);
      more.innerHTML=''; s.done=true;
    } else {
      if(s.page===0) grid.innerHTML='';
      grid.innerHTML+=d.results.map(r=>cardHTML(r,false)).join('');
      s.page++;
      more.innerHTML=d.has_more
        ? `<button class="load-more" onclick="loadGrid('${type}')">Load more…</button>`
        : '';
      if(!d.has_more) s.done=true;
    }
  } catch(e){
    if(s.page===0) showEmpty(grid,'Could not load');
    more.innerHTML='';
  }
  s.loading=false;
}

// ── SEARCH ───────────────────────────────────────────────────────────────────
let _sdeb=null;
$id('sInput').addEventListener('input',()=>{
  const q=$id('sInput').value.trim();
  $id('clearBtn').style.display=q?'block':'none';
  clearTimeout(_sdeb);
  if(!q){$id('searchTabBtn').style.display='none'; return;}
  _sdeb=setTimeout(()=>doSearch(q),450);
});
function clearSearch(){
  $id('sInput').value='';
  $id('clearBtn').style.display='none';
  $id('searchTabBtn').style.display='none';
  switchTab('home',document.querySelector('[data-tab=home]'));
}
async function doSearch(q){
  const btn=$id('searchTabBtn');
  btn.style.display='flex';
  switchTab('search',btn);
  const el=$id('srchResults');
  spin(el);
  try {
    const d=await api('/miniapp/search?q='+encodeURIComponent(q)+'&limit=30');
    if(!d.ok||!d.results||!d.results.length){showEmpty(el,`No results for "${q}"`);return;}
    el.innerHTML='<div class="grid">'+d.results.map(r=>cardHTML(r,false)).join('')+'</div>';
  } catch(e){showEmpty(el,'Search failed. Try again.');}
}

// ── DETAIL SHEET ──────────────────────────────────────────────────────────────
async function openDetail(fileId){
  tg.HapticFeedback.impactOccurred('light');
  $id('dOverlay').classList.add('open');
  $id('dSheet').classList.add('open');
  tg.BackButton.show();
  $id('dHdr').innerHTML='<div class="d-backdrop-fb">🎬</div><button class="d-close" onclick="closeDetail()">✕</button>';
  spin($id('dBody'));
  try {
    const d=await api('/miniapp/group_details?id='+encodeURIComponent(fileId));
    if(!d.ok){$id('dBody').innerHTML='<div class="empty">⚠️ Could not load details</div>';return;}

    // Backdrop
    if(d.meta&&d.meta.backdrop){
      $id('dHdr').innerHTML=`<img class="d-backdrop" src="${esc(d.meta.backdrop)}"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="d-backdrop-fb" style="display:none">🎬</div>
        <button class="d-close" onclick="closeDetail()">✕</button>`;
    }

    const meta=d.meta||{};
    const title=meta.title||cleanTitle(d.caption_title||'');
    const sub=[meta.year||'', meta.rating?('⭐'+meta.rating):''].filter(Boolean).join(' · ');
    const genTags=(meta.genres||[]).slice(0,3).map(g=>`<span class="tag">${esc(g)}</span>`).join('');
    const infoTags=[
      d.db_quality?`<span class="tag">${esc(d.db_quality)}</span>`:'',
      d.db_print  ?`<span class="tag">${esc(d.db_print)}</span>`  :'',
      ...(d.db_languages||[]).map(l=>`<span class="tag">${esc(l)}</span>`),
    ].join('');
    const overview=meta.overview?`<div class="d-overview">${esc(meta.overview)}</div>`:'';

    let body=`<div class="d-title">${esc(title)}</div>
      <div class="d-sub">${esc(sub)}</div>
      ${overview}
      <div class="tags">${genTags}${infoTags}</div>
      <div class="files-section">`;

    if(d.content_type==='series'&&d.seasons){
      const snums=Object.keys(d.seasons).sort((a,b)=>+a-+b);
      if(snums.length>1){
        body+=`<div class="s-tabs">`;
        snums.forEach((s,i)=>{body+=`<div class="s-tab${i===0?' active':''}"
          onclick="switchSeason('${esc(s)}',this)">${+s===0?'Extras':'S'+String(+s).padStart(2,'0')}</div>`;});
        body+=`</div>`;
      }
      snums.forEach((sn,si)=>{
        const eps=d.seasons[sn];
        const enums=Object.keys(eps).sort((a,b)=>+a-+b);
        body+=`<div class="season-panel" id="sp-${esc(sn)}" style="${si>0?'display:none':''}">`;
        enums.forEach(en=>{
          const ep=eps[en];
          const eid=`ep-${sn}-${en}`;
          const fhtml=ep.files.map(fileBtnHTML).join('');
          if(enums.length===1&&ep.files.length===1){body+=fhtml;}
          else{body+=`<div class="ep-group">
            <div class="ep-hdr" onclick="toggleEp('${eid}',this)">
              <span>${esc(ep.label)}</span><span class="ep-chev">›</span></div>
            <div class="ep-files" id="${eid}">${fhtml}</div></div>`;}
        });
        body+=`</div>`;
      });
    } else {
      const files=d.movie_files||[];
      body+=files.length
        ? files.map(fileBtnHTML).join('')
        : '<div style="color:var(--muted);font-size:12px;text-align:center;padding:16px">No files found</div>';
    }
    body+=`</div>`;
    $id('dBody').innerHTML=body;
  } catch(e){$id('dBody').innerHTML='<div class="empty">⚠️ Could not load details</div>';}
}

function fileBtnHTML(f){
  return `<button class="file-btn" onclick="requestFile('${esc(f.id)}')">
    <span class="file-icon">🎞️</span>
    <div class="file-info">
      <div class="file-name">${esc(f.caption||f.raw_name||'File')}</div>
      <div class="file-size">${esc(f.size||'')}</div>
    </div>
    <span class="file-arr">›</span></button>`;
}

function cleanTitle(s){
  return s.replace(/\.(mkv|mp4|avi)$/i,'').replace(/[-_.]+/g,' ').replace(/\s{2,}/g,' ').trim();
}

function closeDetail(){
  $id('dOverlay').classList.remove('open');
  $id('dSheet').classList.remove('open');
  tg.BackButton.hide();
}

function switchSeason(sn,el){
  const body=$id('dBody');
  body.querySelectorAll('.s-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  body.querySelectorAll('.season-panel').forEach(p=>p.style.display='none');
  const panel=$id('sp-'+sn);
  if(panel){panel.style.display='block';panel.scrollIntoView({behavior:'smooth',block:'nearest'});}
}

function toggleEp(id,hdr){
  const panel=$id(id);
  if(!panel) return;
  const open=panel.classList.toggle('open');
  hdr.querySelector('.ep-chev').style.transform=open?'rotate(90deg)':'';
}

// ── FILE REQUEST ─────────────────────────────────────────────────────────────
// When user taps a file:
// 1. Show redirect overlay immediately (instant feedback)
// 2. Open the bot deep-link (navigates Telegram to bot DM)
// 3. After short delay: minimize if supported, else close
function requestFile(fileId){
  if(!fileId) return;
  tg.HapticFeedback.impactOccurred('medium');

  // Show overlay for immediate visual feedback
  $id('redir').classList.add('show');

  const url='https://t.me/'+BOT_USERNAME+'?start=miniapp_'+encodeURIComponent(fileId);

  // Open the bot link — Telegram will navigate to the bot's DM
  tg.openTelegramLink(url);

  // Minimize or close after Telegram has processed the link
  setTimeout(()=>{
    if(typeof tg.minimize==='function'){
      tg.minimize();
    } else {
      tg.close();
    }
  }, 500);
}

// ── BACK BUTTON ───────────────────────────────────────────────────────────────
tg.BackButton.onClick(()=>{
  if($id('dSheet').classList.contains('open')) closeDetail();
});
let _tsY=0;
$id('dSheet').addEventListener('touchstart',e=>{_tsY=e.changedTouches[0].clientY;},{passive:true});
$id('dSheet').addEventListener('touchend',e=>{
  if(e.changedTouches[0].clientY-_tsY>80&&$id('dBody').scrollTop===0) closeDetail();
});

// ── INIT ─────────────────────────────────────────────────────────────────────
loadHome();
</script>
</body>
</html>
