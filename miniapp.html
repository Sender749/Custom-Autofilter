<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Movie Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surface:#0c1018;--card:#111824;--card2:#16202f;
  --border:rgba(255,255,255,0.07);--accent:#f5a623;--accent2:#e8401c;
  --text:#eef2ff;--text2:#b8c4d8;--muted:#5a6880;
  --red:#e84040;--green:#22c55e;--blue:#60a5fa;--purple:#c084fc;
  --radius:12px;--fd:'Bebas Neue',sans-serif;--fb:'DM Sans',sans-serif;
}
html,body{height:100%;width:100%;background:var(--bg)!important;color:var(--text);
  font-family:var(--fb);font-size:14px;line-height:1.5;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:99px}

/* ── LAYOUT ─────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* ── HEADER ─────────────────────────────────────────────── */
.hdr{flex-shrink:0;padding:10px 14px 0;background:rgba(7,9,15,.96);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border);z-index:50;}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo{font-family:var(--fd);font-size:24px;letter-spacing:2px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hdr-count{font-size:10px;color:var(--muted);margin-left:auto;letter-spacing:.5px}

/* search */
.srch-wrap{position:relative;margin-bottom:8px}
.srch-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
#searchInput{width:100%;padding:8px 10px 8px 33px;background:var(--card);
  border:1px solid var(--border);border-radius:9px;color:var(--text);
  font-family:var(--fb);font-size:13px;outline:none;transition:border-color .2s;}
#searchInput:focus{border-color:var(--accent)}
#searchInput::placeholder{color:var(--muted)}
.clr-btn{position:absolute;right:9px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;display:none;}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:4px 11px;border-radius:99px;background:var(--card2);
  border:1px solid var(--border);color:var(--text2);font-size:11px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:all .15s;user-select:none;}
.chip.active{background:rgba(245,166,35,.18);border-color:rgba(245,166,35,.45);color:var(--accent);}

/* ── TABS ───────────────────────────────────────────────── */
.tabs{flex-shrink:0;display:flex;background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:72px;padding:9px 6px;text-align:center;font-size:11.5px;
  font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── CONTENT ────────────────────────────────────────────── */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:env(safe-area-inset-bottom,16px)}
.screen{display:none;padding:10px 10px 14px}
.screen.active{display:block}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.tb-title{font-family:var(--fd);font-size:20px;letter-spacing:1px;color:var(--text);flex:1}
.vbtns{display:flex;gap:4px}
.vbtn{background:var(--card);border:1px solid var(--border);border-radius:6px;
  padding:5px 7px;color:var(--muted);font-size:12px;cursor:pointer;line-height:1;}
.vbtn.active{color:var(--accent);border-color:rgba(245,166,35,.3)}
.rfr-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;
  padding:5px 9px;color:var(--muted);font-size:15px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:color .2s,border-color .2s;}
.rfr-btn:hover{color:var(--accent);border-color:rgba(245,166,35,.3)}
.rfr-btn.spin .rfi{display:inline-block;animation:spin .7s linear infinite}
.rfi{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── GRID ───────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px}
.grid.list-mode{grid-template-columns:1fr;gap:7px}

/* movie card */
.mc{background:var(--card);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;border:1px solid var(--border);position:relative;
  transition:transform .15s,box-shadow .15s;}
.mc:active{transform:scale(.97)}
.mc:hover{box-shadow:0 4px 20px rgba(0,0,0,.6)}
.mc-img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--card2);display:block}
.mc-nop{width:100%;aspect-ratio:2/3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--card2),var(--surface));
  color:var(--muted);font-size:9.5px;font-weight:600;text-align:center;padding:8px;line-height:1.4;}
.mc-info{padding:7px}
.mc-title{font-size:11px;font-weight:600;color:var(--text);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px;}
.mc-meta{display:flex;align-items:center;justify-content:space-between;gap:3px}
.mc-year{font-size:9.5px;color:var(--muted)}
.mc-rat{display:flex;align-items:center;gap:2px;font-size:9.5px;font-weight:600;color:var(--accent)}
.mc-cnt{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.72);
  border-radius:5px;padding:2px 5px;font-size:8.5px;font-weight:700;color:var(--accent)}

/* list card */
.lc{background:var(--card);border-radius:var(--radius);display:flex;gap:9px;
  padding:9px;cursor:pointer;border:1px solid var(--border);align-items:center;transition:border-color .15s;}
.lc:active{background:var(--card2)}
.lc-img{width:48px;height:70px;border-radius:7px;object-fit:cover;flex-shrink:0;}
.lc-nop{width:48px;height:70px;border-radius:7px;background:var(--card2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:9px;font-weight:600;text-align:center;padding:4px;}
.lc-info{flex:1;min-width:0}
.lc-title{font-size:12.5px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.lc-sub{font-size:10.5px;color:var(--muted);margin-bottom:4px}
.lc-bdg{display:flex;gap:4px;flex-wrap:wrap}

/* badges */
.bdg{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;text-transform:uppercase;letter-spacing:.4px}
.bdg-gold{background:rgba(245,166,35,.15);color:var(--accent);border:1px solid rgba(245,166,35,.28)}
.bdg-blue{background:rgba(96,165,250,.15);color:var(--blue);border:1px solid rgba(96,165,250,.28)}
.bdg-green{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.28)}
.bdg-gray{background:rgba(90,104,128,.15);color:var(--muted);border:1px solid rgba(90,104,128,.28)}
.bdg-purple{background:rgba(192,132,252,.15);color:var(--purple);border:1px solid rgba(192,132,252,.28)}

/* ── DETAIL SHEET ───────────────────────────────────────── */
#dSheet{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .25s;}
#dSheet.open{opacity:1;pointer-events:all}
.ds-back{position:absolute;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px)}
.ds-panel{position:relative;margin-top:auto;background:var(--bg);
  border-radius:18px 18px 0 0;max-height:94dvh;overflow-y:auto;
  transform:translateY(28px);transition:transform .3s cubic-bezier(.4,0,.2,1);}
#dSheet.open .ds-panel{transform:translateY(0)}
.ds-handle{width:34px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:9px auto 0}
.ds-close{position:absolute;top:11px;right:11px;background:rgba(0,0,0,.5);border:none;
  border-radius:50%;width:30px;height:30px;color:#fff;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);z-index:5;}

/* detail hero */
.d-hero{position:relative;width:100%;min-height:140px}
.d-bi{width:100%;height:200px;object-fit:cover;object-position:center 20%;display:block}
.d-bg{position:absolute;bottom:0;left:0;right:0;height:90px;
  background:linear-gradient(to top,var(--bg),transparent);pointer-events:none;}
.d-nobg{min-height:0;background:linear-gradient(160deg,var(--card2),var(--surface))}

/* detail content */
.d-content{padding:0 14px 28px}
.d-prow{display:flex;gap:12px;margin-top:-65px;margin-bottom:14px;position:relative;z-index:2;align-items:flex-end;}
.d-prow.nobk{margin-top:0;padding-top:14px;align-items:flex-start}
.d-poster{width:88px;height:126px;border-radius:9px;object-fit:cover;
  border:3px solid var(--bg);background:var(--card2);flex-shrink:0;box-shadow:0 6px 20px rgba(0,0,0,.65);}
.d-poster-ph{width:88px;height:126px;border-radius:9px;background:var(--card2);
  border:3px solid var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:600;color:var(--muted);text-align:center;padding:6px;letter-spacing:.4px;text-transform:uppercase;}
.d-pinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:3px}
.d-title{font-family:var(--fd);font-size:22px;letter-spacing:1px;line-height:1.1;margin-bottom:3px;color:var(--text)}
.d-tline{font-size:10.5px;color:var(--muted);font-style:italic;margin-bottom:5px;line-height:1.4}
.d-mrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.rat-pill{display:inline-flex;align-items:center;gap:3px;background:rgba(245,166,35,.13);
  border:1px solid rgba(245,166,35,.28);border-radius:99px;padding:3px 9px;
  font-size:11.5px;font-weight:700;color:var(--accent);}
.d-capbox{background:var(--card);border:1px solid var(--border);border-radius:9px;
  padding:9px 11px;margin-bottom:12px;}
.d-caplabel{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:3px}
.d-captext{font-size:11px;color:var(--text2);line-height:1.5;word-break:break-word}
.d-capcnt{font-size:9.5px;color:var(--accent);margin-top:2px;font-weight:600}
.d-sec{margin-bottom:14px}
.d-seclbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin-bottom:7px}
.d-plot{font-size:12.5px;line-height:1.6;color:var(--text2)}
.genre-pills{display:flex;flex-wrap:wrap;gap:4px}
.cast-list{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
.cast-list::-webkit-scrollbar{display:none}
.cast-chip{flex-shrink:0;background:var(--card2);border:1px solid var(--border);
  border-radius:7px;padding:5px 9px;font-size:10.5px;white-space:nowrap;color:var(--text2);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.info-it{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 9px}
.info-it .lbl{font-size:8.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:2px}
.info-it .val{font-size:11.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info-it.full{grid-column:1/-1}

/* files section */
.s-tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.s-tabs::-webkit-scrollbar{display:none}
.s-tab{flex-shrink:0;padding:5px 13px;border-radius:99px;background:var(--card);
  border:1px solid var(--border);color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.s-tab.active{background:rgba(245,166,35,.13);border-color:rgba(245,166,35,.32);color:var(--accent)}
.ep-grp{margin-bottom:6px}
.ep-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;
  background:var(--card2);border:1px solid var(--border);border-radius:9px;cursor:pointer;margin-bottom:3px;}
.ep-hdr-t{font-size:11.5px;font-weight:600;color:var(--text2)}
.ep-chev{color:var(--muted);font-size:13px;transition:transform .2s}
.ep-chev.open{transform:rotate(90deg)}
.ep-files{display:none;padding-left:6px}.ep-files.open{display:block}
.fbtn{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);
  border-radius:9px;padding:10px 12px;margin-bottom:6px;cursor:pointer;width:100%;text-align:left;
  transition:background .15s,border-color .15s;}
.fbtn:active{background:var(--card2)}
.fbtn:hover{border-color:rgba(245,166,35,.3)}
.fbtn-ic{width:36px;height:36px;border-radius:7px;background:rgba(245,166,35,.1);
  border:1px solid rgba(245,166,35,.2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:8.5px;font-weight:700;
  color:var(--accent);flex-shrink:0;line-height:1.2;}
.fbtn-info{flex:1;min-width:0}
.fbtn-cap{font-size:10.5px;font-weight:600;color:var(--text);margin-bottom:2px;line-height:1.4;word-break:break-word}
.fbtn-meta{font-size:9.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn-sz{font-size:9.5px;color:var(--accent);font-weight:600;flex-shrink:0}

/* combined seasons */
.cs-box{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px;margin-top:16px}
.cs-ttl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin-bottom:9px}
.cs-grid{display:flex;flex-wrap:wrap;gap:7px}
.s-pill{background:var(--card2);border:1px solid var(--border);border-radius:7px;
  padding:7px 11px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s;}
.s-pill:active{background:rgba(245,166,35,.09);border-color:rgba(245,166,35,.32)}
.s-pill .sp-l{font-size:11.5px;font-weight:600;color:var(--text)}
.s-pill .sp-e{font-size:9.5px;color:var(--muted);margin-top:2px}

/* ── SKELETON ───────────────────────────────────────────── */
.sk{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);
  background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:7px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── EMPTY ──────────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:44px 20px;text-align:center;gap:8px;color:var(--muted);}
.empty-ttl{font-size:15px;font-weight:600;color:var(--text)}
.empty-sub{font-size:11.5px}

/* ── INFINITE SCROLL ────────────────────────────────────── */
.sentinel{height:56px;display:flex;align-items:center;justify-content:center}
.ld-spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:none;}
.ld-spin.vis{display:block}

/* ── TOAST ──────────────────────────────────────────────── */
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;
  transform:translateX(-50%) translateY(18px);background:var(--card2);
  border:1px solid var(--border);border-radius:9px;padding:9px 16px;
  font-size:12.5px;font-weight:500;color:var(--text);
  box-shadow:0 8px 28px rgba(0,0,0,.55);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:500;white-space:nowrap;max-width:88vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LOADER ─────────────────────────────────────────────── */
#loader{position:fixed;inset:0;z-index:999;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;transition:opacity .4s;}
#loader.out{opacity:0;pointer-events:none}
.ld-logo{font-family:var(--fd);font-size:40px;letter-spacing:4px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ld-ring{width:30px;height:30px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
</style>
</head>
<body>

<div id="loader">
  <div class="ld-logo">MOVIE ZONE</div>
  <div class="ld-ring"></div>
</div>

<div id="app">
  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-top">
      <div class="logo">Movie Zone</div>
      <div class="hdr-count" id="dbCount">Loading…</div>
    </div>
    <div class="srch-wrap">
      <span class="srch-ic">⌕</span>
      <input type="text" id="searchInput" placeholder="Search movies, series, anime…"/>
      <button class="clr-btn" id="clearBtn" onclick="clearSearch()">✕</button>
    </div>
    <div class="chips" id="chipsWrap"></div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" data-tab="movies"  onclick="switchTab('movies',this)">🎬 Movies</div>
    <div class="tab"        data-tab="series"  onclick="switchTab('series',this)">📺 Series</div>
    <div class="tab"        data-tab="anime"   onclick="switchTab('anime',this)">✨ Anime</div>
    <div class="tab"        data-tab="search" id="searchTab" style="display:none" onclick="switchTab('search',this)">🔍 Search</div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="mainContent">

    <!-- Movies screen -->
    <div class="screen active" id="screen-movies">
      <div class="toolbar">
        <div class="tb-title">Movies</div>
        <div class="vbtns">
          <button class="vbtn active" id="moviesGB" onclick="setView('movies','grid')">⊞</button>
          <button class="vbtn"        id="moviesLB" onclick="setView('movies','list')">≡</button>
        </div>
        <button class="rfr-btn" id="moviesRfr" onclick="doRefresh('movies')" title="Refresh">
          <span class="rfi">⟳</span>
        </button>
      </div>
      <div class="grid" id="moviesGrid"></div>
      <div class="sentinel" id="moviesSen"><div class="ld-spin" id="moviesSpin"></div></div>
    </div>

    <!-- Series screen -->
    <div class="screen" id="screen-series">
      <div class="toolbar">
        <div class="tb-title">Series</div>
        <div class="vbtns">
          <button class="vbtn active" id="seriesGB" onclick="setView('series','grid')">⊞</button>
          <button class="vbtn"        id="seriesLB" onclick="setView('series','list')">≡</button>
        </div>
        <button class="rfr-btn" id="seriesRfr" onclick="doRefresh('series')" title="Refresh">
          <span class="rfi">⟳</span>
        </button>
      </div>
      <div class="grid" id="seriesGrid"></div>
      <div class="sentinel" id="seriesSen"><div class="ld-spin" id="seriesSpin"></div></div>
    </div>

    <!-- Anime screen -->
    <div class="screen" id="screen-anime">
      <div class="toolbar">
        <div class="tb-title">Anime</div>
        <div class="vbtns">
          <button class="vbtn active" id="animeGB" onclick="setView('anime','grid')">⊞</button>
          <button class="vbtn"        id="animeLB" onclick="setView('anime','list')">≡</button>
        </div>
        <button class="rfr-btn" id="animeRfr" onclick="doRefresh('anime')" title="Refresh">
          <span class="rfi">⟳</span>
        </button>
      </div>
      <div class="grid" id="animeGrid"></div>
      <div class="sentinel" id="animeSen"><div class="ld-spin" id="animeSpin"></div></div>
    </div>

    <!-- Search screen -->
    <div class="screen" id="screen-search">
      <div id="searchResults">
        <div class="empty"><div class="empty-ttl">Search anything</div>
          <div class="empty-sub">Movies · Series · Anime</div></div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /app -->

<!-- DETAIL SHEET -->
<div id="dSheet">
  <div class="ds-back" onclick="closeDetail()"></div>
  <div class="ds-panel" id="dsPanel">
    <div class="ds-handle"></div>
    <button class="ds-close" onclick="closeDetail()">✕</button>
    <div id="dContent"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
const API_BASE     = 'https://melodic-janina-naha-afde7f15.koyeb.app';
const BOT_USERNAME = 'Navex_MoviesHub_Bot';

const QUICK_CHIPS = [
  { label:'Bollywood',     query:'bollywood hindi',   strip:['bollywood','hindi']   },
  { label:'Hollywood',     query:'hollywood english', strip:['hollywood','english']  },
  { label:'Punjabi',       query:'punjabi',           strip:[]                       },
  { label:'Latest 2025',   query:'2025',              strip:[]                       },
  { label:'Latest 2024',   query:'2024',              strip:[]                       },
  { label:'Adult',         query:'adult',             strip:[]                       },
  { label:'Hentai',        query:'hentai',            strip:[]                       },
];

// ─── STATE ─────────────────────────────────────────────────────────────────
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

let currentTab   = 'movies';
let activeChip   = null;
let preChipTab   = 'movies';
let searchTimer  = null;

// Per-tab state — NO cache, always fetch fresh
const TS = {
  movies: { cards:[], page:0, loading:false, hasMore:true, seenPosters:new Set(), seenTitles:new Set(), mode:'recent' },
  series: { cards:[], page:0, loading:false, hasMore:true, seenPosters:new Set(), seenTitles:new Set(), mode:'recent' },
  anime:  { cards:[], page:0, loading:false, hasMore:true, seenPosters:new Set(), seenTitles:new Set(), mode:'recent' },
};
const viewMode = { movies:'grid', series:'grid', anime:'grid' };

// ─── INIT ──────────────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  buildChips();
  await loadTab('movies', true);
  hideLoader();
  setupScroll();
});

function hideLoader() {
  const l = document.getElementById('loader');
  l.classList.add('out');
  setTimeout(() => l.remove(), 500);
}

// ─── API ───────────────────────────────────────────────────────────────────
async function api(path) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 20000);
    const r = await fetch(API_BASE + path, {
      headers:{'X-Telegram-Init-Data': tg.initData || ''},
      signal: c.signal,
    });
    clearTimeout(t);
    return r.ok ? await r.json() : null;
  } catch(e) { return null; }
}

// ─── CHIPS ─────────────────────────────────────────────────────────────────
function buildChips() {
  const w = document.getElementById('chipsWrap');
  QUICK_CHIPS.forEach(chip => {
    const el = document.createElement('div');
    el.className = 'chip';
    el.textContent = chip.label;
    el.onclick = () => toggleChip(chip, el);
    w.appendChild(el);
  });
}

function stripWords(q, words) {
  let s = q;
  for (const w of words)
    s = s.replace(new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','gi'),'');
  return s.replace(/\s{2,}/g,' ').trim();
}

async function toggleChip(chip, el) {
  if (activeChip === chip.label) {
    activeChip = null;
    el.classList.remove('active');
    document.getElementById('searchInput').value = '';
    document.getElementById('clearBtn').style.display = 'none';
    document.getElementById('searchTab').style.display = 'none';
    tg.HapticFeedback.selectionChanged();
    switchTab(preChipTab, document.querySelector(`[data-tab="${preChipTab}"]`));
    return;
  }
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeChip = chip.label;
  preChipTab = currentTab !== 'search' ? currentTab : preChipTab;
  tg.HapticFeedback.impactOccurred('light');
  const q = stripWords(chip.query, chip.strip);
  if (!q) { showToast('Empty query'); activeChip=null; el.classList.remove('active'); return; }
  document.getElementById('searchInput').value = chip.label;
  document.getElementById('clearBtn').style.display = 'block';
  await runSearch(q, `"${chip.label}"`);
  showSrchTab();
}

// ─── TAB LOADING ───────────────────────────────────────────────────────────
async function loadTab(tab, reset = false, forceMode = null) {
  const st = TS[tab];
  if (!reset && st.cards.length > 0 && !st.hasMore) return;
  if (st.loading) return;

  const grid = document.getElementById(tab + 'Grid');
  if (reset) {
    st.cards = []; st.page = 0; st.hasMore = true;
    st.seenPosters = new Set(); st.seenTitles = new Set();
    // Use forceMode if given; otherwise reset back to 'recent'
    st.mode = forceMode || 'recent';
    grid.innerHTML = skelGrid(12);
  } else if (st.page === 0) {
    grid.innerHTML = skelGrid(12);
  }

  st.loading = true;
  const data = await api(`/miniapp/browse?type=${tab}&page=${st.page}&limit=24&mode=${st.mode}`);
  st.loading = false;

  if (reset) grid.innerHTML = '';

  if (data && data.ok && data.results && data.results.length) {
    // Deduplicate by BOTH poster URL and normalised title — prevents same movie twice
    const fresh = data.results.filter(c => {
      if (!c.poster) return false;
      const titleKey = (c.name || c.group_title || '').toLowerCase().replace(/[^a-z0-9]/g,'');
      if (st.seenPosters.has(c.poster) || st.seenTitles.has(titleKey)) return false;
      st.seenPosters.add(c.poster);
      if (titleKey) st.seenTitles.add(titleKey);
      return true;
    });
    st.cards.push(...fresh);
    st.hasMore = data.has_more !== false;
    if (st.page === 0 && grid.innerHTML.includes('sk')) grid.innerHTML = '';
    fresh.forEach(item => grid.appendChild(
      viewMode[tab] === 'list' ? buildLC(item) : buildMC(item)
    ));
    document.getElementById('dbCount').textContent =
      st.cards.length + (st.hasMore ? '+' : '') + ' titles';
  } else if (data && data.ok && st.page === 0) {
    st.hasMore = false;
    grid.innerHTML = emptyHTML('Nothing here yet','Files will appear as they are added');
  } else if (!data && st.page === 0) {
    st.hasMore = false;
    grid.innerHTML = emptyHTML('Could not connect','') +
      `<div style="text-align:center;margin-top:14px">
        <button onclick="loadTab('${tab}',true)"
          style="background:var(--accent);color:#000;border:none;padding:9px 22px;
                 border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">⟳ Retry</button>
       </div>`;
  }
}

async function loadMore(tab) {
  const st = TS[tab];
  if (st.loading || !st.hasMore) return;
  const spin = document.getElementById(tab + 'Spin');
  spin.classList.add('vis');
  st.page++;
  st.loading = true;
  const data = await api(`/miniapp/browse?type=${tab}&page=${st.page}&limit=24&mode=${st.mode}`);
  st.loading = false;
  if (data && data.ok && data.results && data.results.length) {
    const grid  = document.getElementById(tab + 'Grid');
    const fresh = data.results.filter(c => {
      if (!c.poster) return false;
      const titleKey = (c.name || c.group_title || '').toLowerCase().replace(/[^a-z0-9]/g,'');
      if (st.seenPosters.has(c.poster) || st.seenTitles.has(titleKey)) return false;
      st.seenPosters.add(c.poster);
      if (titleKey) st.seenTitles.add(titleKey);
      return true;
    });
    st.cards.push(...fresh);
    st.hasMore = data.has_more !== false;
    fresh.forEach(item => grid.appendChild(
      viewMode[tab] === 'list' ? buildLC(item) : buildMC(item)
    ));
  } else {
    st.hasMore = false;
  }
  spin.classList.remove('vis');
}

// Refresh button → random mode, full reset
async function doRefresh(tab) {
  const btn = document.getElementById(tab + 'Rfr');
  btn.classList.add('spin');
  tg.HapticFeedback.impactOccurred('light');
  await loadTab(tab, true, 'random');   // pass mode explicitly so reset can't clobber it
  btn.classList.remove('spin');
  showToast('Showing random picks!');
}

function setupScroll() {
  ['movies','series','anime'].forEach(tab => {
    const obs = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting && currentTab === tab) loadMore(tab);
    }, {rootMargin:'280px'});
    obs.observe(document.getElementById(tab + 'Sen'));
  });
}

// ─── SEARCH ────────────────────────────────────────────────────────────────
async function runSearch(q, label) {
  const box = document.getElementById('searchResults');
  box.innerHTML = skelGrid(8);
  const data = await api('/miniapp/search?q=' + encodeURIComponent(q));
  const lbl  = label || `"${q}"`;
  if (data && data.ok && data.results && data.results.length) {
    box.innerHTML = `<div style="font-family:'Bebas Neue',sans-serif;font-size:19px;
      letter-spacing:1px;color:var(--text);margin-bottom:9px">Results for ${esc(lbl)}
      <small style="font-size:11px;color:var(--muted);font-family:'DM Sans',sans-serif">
        ${data.results.length} found</small></div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    box.appendChild(grid);
    data.results.forEach(item => grid.appendChild(buildMC(item)));
  } else {
    box.innerHTML = emptyHTML('Nothing found', 'No results for ' + esc(lbl));
  }
}

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim();
  document.getElementById('clearBtn').style.display = q ? 'block' : 'none';
  if (!q) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    activeChip = null;
    document.getElementById('searchTab').style.display = 'none';
    switchTab(preChipTab || 'movies', document.querySelector(`[data-tab="${preChipTab||'movies'}"]`));
    return;
  }
  if (currentTab !== 'search') { preChipTab = currentTab; showSrchTab(); }
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(q), 420);
});

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  activeChip = null;
  document.getElementById('searchTab').style.display = 'none';
  switchTab('movies', document.querySelector('[data-tab="movies"]'));
}

function showSrchTab() {
  const st = document.getElementById('searchTab');
  st.style.display = '';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  st.classList.add('active');
  document.getElementById('screen-search').classList.add('active');
  currentTab = 'search';
}

// ─── TAB SWITCH ────────────────────────────────────────────────────────────
function switchTab(tab, el) {
  if (tab !== 'search') {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    activeChip = null;
    document.getElementById('searchTab').style.display = 'none';
  }
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const tabEl = el || document.querySelector(`[data-tab="${tab}"]`);
  if (tabEl) tabEl.classList.add('active');
  document.getElementById('screen-' + tab).classList.add('active');
  tg.HapticFeedback.selectionChanged();
  if (tab !== 'search') {
    // If this tab has never been loaded, load it now (recent mode)
    if (TS[tab].cards.length === 0 && !TS[tab].loading) loadTab(tab, true);
  }
}

// ─── VIEW MODE ─────────────────────────────────────────────────────────────
function setView(tab, mode) {
  viewMode[tab] = mode;
  document.getElementById(tab + 'GB').classList.toggle('active', mode==='grid');
  document.getElementById(tab + 'LB').classList.toggle('active', mode==='list');
  const grid = document.getElementById(tab + 'Grid');
  grid.className = mode === 'list' ? 'grid list-mode' : 'grid';
  grid.innerHTML = '';
  TS[tab].cards.forEach(item => grid.appendChild(mode === 'list' ? buildLC(item) : buildMC(item)));
  tg.HapticFeedback.selectionChanged();
}

// ─── CARD BUILDERS ─────────────────────────────────────────────────────────
function buildMC(item) {
  const div  = document.createElement('div');
  div.className = 'mc';
  div.setAttribute('data-id', item.id);
  div.onclick = () => openDetail(item.id);
  const name = esc(item.name || item.group_title);
  const cnt  = item.file_count > 1 ? `<div class="mc-cnt">${item.file_count}</div>` : '';
  const rat  = item.rating ? `<span class="mc-rat">★ ${item.rating}</span>` : '';
  const yr   = item.year   ? `<span class="mc-year">${item.year}</span>` : '';
  const badge = item.type === 'anime'
    ? '<span class="bdg bdg-purple" style="display:block;margin-top:2px">ANIME</span>'
    : (item.type === 'series' || item.type === 'tv')
      ? '<span class="bdg bdg-blue" style="display:block;margin-top:2px">SERIES</span>' : '';
  div.innerHTML = cnt +
    `<img class="mc-img" src="${esc(item.poster)}" alt="${name}" loading="lazy"
       onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
     <div class="mc-nop" style="display:none">${name}</div>
     <div class="mc-info">
       <div class="mc-title">${name}</div>
       <div class="mc-meta">${yr}${rat}</div>
       ${badge}
     </div>`;
  return div;
}

function buildLC(item) {
  const div  = document.createElement('div');
  div.className = 'lc';
  div.onclick = () => openDetail(item.id);
  const name  = esc(item.name || item.group_title);
  const rat   = item.rating ? `<span class="bdg bdg-gold">★ ${item.rating}</span>` : '';
  const badge = item.type === 'anime'
    ? '<span class="bdg bdg-purple">ANIME</span>'
    : (item.type === 'series' || item.type === 'tv')
      ? '<span class="bdg bdg-blue">SERIES</span>'
      : '<span class="bdg bdg-green">MOVIE</span>';
  const fc    = item.file_count > 1 ? ` · ${item.file_count} files` : '';
  div.innerHTML =
    `<img class="lc-img" src="${esc(item.poster)}" alt="${name}" loading="lazy"
       onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
     <div class="lc-nop" style="display:none">${name.slice(0,16)}</div>
     <div class="lc-info">
       <div class="lc-title">${name}</div>
       <div class="lc-sub">${item.year || ''}${fc}</div>
       <div class="lc-bdg">${badge}${rat}</div>
     </div>
     <span style="color:var(--muted);font-size:17px">›</span>`;
  return div;
}

// ─── DETAIL SHEET ──────────────────────────────────────────────────────────
async function openDetail(fileId) {
  document.getElementById('dContent').innerHTML =
    `<div style="padding:24px"><div class="sk" style="height:22px;width:65%;margin-bottom:10px"></div>
     <div class="sk" style="height:14px;width:45%"></div></div>`;
  document.getElementById('dSheet').classList.add('open');
  document.body.style.overflow = 'hidden';

  const data = await api('/miniapp/group_details?id=' + encodeURIComponent(fileId));
  if (!data || !data.ok) {
    document.getElementById('dContent').innerHTML =
      '<div style="padding:28px;text-align:center;color:var(--muted)">Could not load details.</div>';
    return;
  }
  renderDetail(data);
}

function renderDetail(data) {
  const meta    = data.meta || {};
  const isSeries= data.content_type === 'series';
  const title   = meta.title    || data.caption_title || 'Unknown';
  const year    = meta.year     || '';
  const poster  = meta.poster   || null;
  const backdrop= meta.backdrop || null;
  const rating  = meta.rating   || null;
  const plot    = meta.plot     || '';
  const genres  = meta.genres   || [];
  const cast    = meta.cast     || [];
  const director= meta.director || '';
  const runtime = meta.runtime  || '';
  const tagline = meta.tagline  || '';
  const status  = meta.status   || '';
  const mtype   = meta.type     || data.content_type || 'movie';
  const seasons = meta.seasons  || null;
  const episodes= meta.episodes || null;

  const bdHtml = backdrop
    ? `<div class="d-hero"><img class="d-bi" src="${esc(backdrop)}" alt="${esc(title)}"
         onerror="this.parentElement.classList.add('d-nobg')">
       <div class="d-bg"></div></div>`
    : '';

  const pHtml = poster
    ? `<img class="d-poster" src="${esc(poster)}" alt="${esc(title)}"
         onerror="this.outerHTML='<div class=\\'d-poster-ph\\'>${esc(title).slice(0,22)}</div>'">`
    : `<div class="d-poster-ph">${esc(title).slice(0,22)}</div>`;

  const ratHtml  = rating  ? `<span class="rat-pill">★ ${rating} <span style="font-weight:400;color:var(--muted)">/10</span></span>` : '';
  const yrBdg    = year    ? `<span class="bdg bdg-gray">${year}</span>` : '';
  const typBdg   = (mtype==='tv'||isSeries) ? '<span class="bdg bdg-blue">TV Series</span>' : '<span class="bdg bdg-green">Movie</span>';
  const genHtml  = genres.map(g => `<span class="bdg bdg-gray">${esc(g)}</span>`).join('');
  const castHtml = cast.length ? cast.map(c => `<div class="cast-chip">${esc(c)}</div>`).join('') : '<span style="color:var(--muted);font-size:11px">N/A</span>';

  const capHtml = data.caption_title
    ? `<div class="d-capbox"><div class="d-caplabel">In Database</div>
       <div class="d-captext">${esc(data.caption_title)}</div>
       <div class="d-capcnt">${data.file_count} file${data.file_count!==1?'s':''} available</div></div>` : '';

  const dbLangs  = (data.db_languages || []).join(', ');
  const infoItems = [
    director ? `<div class="info-it"><div class="lbl">Director</div><div class="val">${esc(director)}</div></div>` : '',
    runtime  ? `<div class="info-it"><div class="lbl">Runtime</div><div class="val">${esc(runtime)}</div></div>` : '',
    seasons  ? `<div class="info-it"><div class="lbl">Seasons</div><div class="val">${seasons}</div></div>` : '',
    episodes ? `<div class="info-it"><div class="lbl">Episodes</div><div class="val">${episodes}</div></div>` : '',
    status   ? `<div class="info-it"><div class="lbl">Status</div><div class="val">${esc(status)}</div></div>` : '',
    data.db_quality ? `<div class="info-it"><div class="lbl">Quality</div><div class="val">${esc(data.db_quality)}</div></div>` : '',
    data.db_print   ? `<div class="info-it"><div class="lbl">Print</div><div class="val">${esc(data.db_print)}</div></div>` : '',
    dbLangs  ? `<div class="info-it"><div class="lbl">Languages</div><div class="val">${esc(dbLangs)}</div></div>` : '',
    data.db_subtitles? `<div class="info-it"><div class="lbl">Subtitles</div><div class="val">${esc(data.db_subtitles)}</div></div>` : '',
  ].filter(Boolean).join('');

  // Files section
  let filesHtml = '';
  if (isSeries && data.seasons) {
    const sNums = Object.keys(data.seasons).map(Number).sort((a,b)=>a-b);
    const tabsH = sNums.map((s,i) => `<div class="s-tab${i===0?' active':''}" onclick="switchSeason(${s},this)">${s===0?'Extras':'S'+String(s).padStart(2,'0')}</div>`).join('');
    let panels = ''; let totalF = 0;
    for (const s of sNums) {
      const epData = data.seasons[String(s)]; let epH = '';
      for (const [ep, epInfo] of Object.entries(epData).sort((a,b)=>Number(a[0])-Number(b[0]))) {
        totalF += epInfo.files.length;
        const fH = epInfo.files.map(f => fBtn(f)).join('');
        if (Number(ep) === 0) {
          epH += `<div class="ep-grp"><div class="ep-files open">${fH}</div></div>`;
        } else {
          const eid = `ep-${s}-${ep}`;
          epH += `<div class="ep-grp">
            <div class="ep-hdr" onclick="toggleEp('${eid}',this)">
              <span class="ep-hdr-t">${esc(epInfo.label)}</span>
              <span class="ep-chev">›</span>
            </div>
            <div class="ep-files" id="${eid}">${fH}</div></div>`;
        }
      }
      panels += `<div class="s-panel" id="sp-${s}" style="${s===sNums[0]?'':'display:none'}">${epH}</div>`;
    }
    filesHtml = `<div><div class="d-seclbl">Files (${totalF})</div>
      <div class="s-tabs">${tabsH}</div>${panels}</div>`;
  } else if (data.movie_files && data.movie_files.length) {
    filesHtml = `<div><div class="d-seclbl">Files (${data.movie_files.length})</div>
      ${data.movie_files.map(f => fBtn(f)).join('')}</div>`;
  }

  const cs  = data.combined_seasons || [];
  const csH = cs.length > 1
    ? `<div class="cs-box"><div class="cs-ttl">All Seasons</div><div class="cs-grid">
       ${cs.map(s => `<div class="s-pill" onclick="switchSeasonPill(${s.season})">
         <div class="sp-l">${esc(s.label)}</div>
         <div class="sp-e">${s.episode_count} ep${s.episode_count!==1?'s':''}</div>
       </div>`).join('')}</div></div>` : '';

  const pRowClass = backdrop ? 'd-prow' : 'd-prow nobk';
  document.getElementById('dContent').innerHTML =
    bdHtml +
    `<div class="d-content">
       <div class="${pRowClass}">
         ${pHtml}
         <div class="d-pinfo">
           <div class="d-title">${esc(title)}</div>
           ${tagline ? `<div class="d-tline">${esc(tagline)}</div>` : ''}
           <div class="d-mrow">${ratHtml} ${yrBdg} ${typBdg}</div>
         </div>
       </div>
       ${capHtml}
       ${genHtml ? `<div class="d-sec"><div class="d-seclbl">Genres</div><div class="genre-pills">${genHtml}</div></div>` : ''}
       ${plot    ? `<div class="d-sec"><div class="d-seclbl">Plot</div><div class="d-plot">${esc(plot)}</div></div>` : ''}
       ${cast.length ? `<div class="d-sec"><div class="d-seclbl">Cast</div><div class="cast-list">${castHtml}</div></div>` : ''}
       ${infoItems ? `<div class="d-sec"><div class="d-seclbl">Info</div><div class="info-grid">${infoItems}</div></div>` : ''}
       ${filesHtml}
       ${csH}
     </div>`;
}

function fBtn(f) {
  const ql = f.quality || (f.season > 0 ? 'TV' : 'HD');
  const pl = f.print_type ? f.print_type.slice(0,7) : '';
  const ic = pl
    ? `<span style="font-size:8px">${esc(ql)}</span><span style="font-size:7px;color:var(--muted)">${esc(pl)}</span>`
    : `<span>${esc(ql)}</span>`;
  return `<button class="fbtn" data-file-id="${esc(f.id)}" onclick="reqFile(this)">
    <div class="fbtn-ic">${ic}</div>
    <div class="fbtn-info">
      <div class="fbtn-cap">${esc(f.caption || f.raw_name || '')}</div>
    </div>
    <div class="fbtn-sz">${esc(f.size)}</div>
  </button>`;
}

function reqFile(btn) {
  const fid = btn.getAttribute('data-file-id');
  if (!fid) return;
  tg.HapticFeedback.impactOccurred('medium');
  tg.openTelegramLink('https://t.me/' + BOT_USERNAME);
  fetch(API_BASE + '/miniapp/send_file', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({file_id: fid, initData: tg.initData || ''}),
  }).catch(()=>{});
}

function switchSeason(s, el) {
  document.querySelectorAll('.s-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.s-panel').forEach(p => p.style.display='none');
  const p = document.getElementById('sp-'+s);
  if (p) { p.style.display='block'; p.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}
function switchSeasonPill(s) {
  document.querySelectorAll('.s-tab').forEach(t => {
    const txt = t.textContent.trim();
    if (txt === (s===0?'Extras':'S'+String(s).padStart(2,'0'))) switchSeason(s,t);
  });
  const fs = document.querySelector('.d-sec');
  if (fs) fs.scrollIntoView({behavior:'smooth',block:'start'});
}
function toggleEp(id, hdr) {
  const p = document.getElementById(id); if (!p) return;
  const open = p.classList.toggle('open');
  hdr.querySelector('.ep-chev').classList.toggle('open', open);
}
function closeDetail() {
  document.getElementById('dSheet').classList.remove('open');
  document.body.style.overflow = '';
}

// swipe-down to close detail
let _tsY = 0;
document.getElementById('dsPanel').addEventListener('touchstart', e => { _tsY = e.touches[0].clientY; }, {passive:true});
document.getElementById('dsPanel').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - _tsY > 80 && document.getElementById('dsPanel').scrollTop === 0) closeDetail();
}, {passive:true});

tg.BackButton.onClick(() => {
  if (document.getElementById('dSheet').classList.contains('open')) {
    closeDetail(); tg.BackButton.hide();
  }
});
document.getElementById('dSheet').addEventListener('transitionend', () => {
  if (document.getElementById('dSheet').classList.contains('open')) tg.BackButton.show();
  else tg.BackButton.hide();
});

// ─── UTILS ─────────────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg, d=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), d);
}
function skelCard() {
  return `<div class="mc"><div class="sk" style="width:100%;aspect-ratio:2/3"></div>
    <div class="mc-info">
      <div class="sk" style="height:11px;width:80%;margin-bottom:5px;border-radius:3px"></div>
      <div class="sk" style="height:9px;width:50%;border-radius:3px"></div>
    </div></div>`;
}
function skelGrid(n) { return Array(n).fill(skelCard()).join(''); }
function emptyHTML(title, sub) {
  return `<div class="empty"><div class="empty-ttl">${title}</div><div class="empty-sub">${sub}</div></div>`;
}
</script>
